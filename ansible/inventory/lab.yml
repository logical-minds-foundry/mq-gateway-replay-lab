---
# Inventory for applying gw_queues against the RUNNING lab queue manager.
#
# Provide the live values at apply time — there are deliberately no misleading
# defaults for the queue manager, so a mis-targeted apply fails loudly rather
# than silently hitting the wrong box (parasite / boundary rule):
#   ansible-playbook -i inventory/lab.yml ../site.yml -e qmgr_name=<LAB_QM>
#
# ansible_host defaults to localhost on the assumption the playbook runs on the
# active queue-manager node inside the shared lab VM; override lab_qm_host if the
# active instance is elsewhere in the 3+3.
gateway_qm:
  hosts:
    lab_qm:
      ansible_host: "{{ lab_qm_host | default('localhost') }}"
  vars:
    counterparty: CPB

# The obs node (Prometheus + Grafana) from which gw_observability deploys the
# targets file and the boards; it delegates the exporter service to
# gw_exporter_host. Set gw_obs_host / gw_exporter_host / gw_exporter_qmgr /
# gw_exporter_conn at apply time (no misleading defaults for the live topology).
gateway_obs:
  hosts:
    lab_obs:
      ansible_host: "{{ gw_obs_host | default('localhost') }}"
  vars:
    counterparty: CPB

# The counterparty's own queue manager (SVCQM), reached over the lab's
# EXISTING inter-QM link (issue #56). This is the only group that targets a
# box other than our own queue manager; gw_svc_queues still only creates its
# own GW.* objects there and declare-and-verifies the existing return
# XMITQ/channel (parasite / boundary rule). Provide qmgr_name (SVCQM's live
# instance name) and our_qmgr at apply time — no misleading defaults for
# either, so a mis-targeted apply fails loudly rather than silently wiring the
# reply route to the wrong box.
gateway_svc_qm:
  hosts:
    svc_qm:
      ansible_host: "{{ svc_qm_host | default('localhost') }}"
  vars:
    counterparty: CPB
