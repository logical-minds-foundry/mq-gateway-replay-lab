---
# The gateway is a loosely-coupled parasite: it makes every change it needs to
# the RUNNING lab from its own tooling (here), idempotently. The lab knows nothing
# about it and does not preserve these changes — a lab rebuild wipes them, and
# re-running this role re-establishes them. The parasite's contract: don't break
# the lab, and don't expect the lab to respect what it added.
- name: Assert the required apply-time values were provided
  ansible.builtin.assert:
    that:
      - gw_exporter_qmgr | length > 0
      - gw_exporter_conn | length > 0
      - gw_app_client_p12 | length > 0
      - gw_app_client_pw | length > 0
    fail_msg: >-
      Set gw_exporter_qmgr, gw_exporter_conn, and the app-client keystore
      (gw_app_client_p12 + gw_app_client_pw) at apply time. No misleading defaults
      for the live topology or secrets — a mis-targeted apply must fail loudly.

# --- provision the exporter runtime on the exporter host ----------------------
- name: Create the gwlab virtualenv with pymqi (compiled against the MQ client)
  ansible.builtin.pip:
    name: pymqi
    virtualenv: "{{ gw_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
  environment:
    MQ_INSTALLATION_PATH: "{{ gw_mq_installation }}"
  become: true
  delegate_to: "{{ gw_exporter_host }}"

- name: Place the gwlab source on the exporter host
  ansible.builtin.copy:
    src: "{{ gw_src_local }}"
    dest: "{{ gw_src_dir }}/"
    mode: "0644"
    directory_mode: "0755"
  become: true
  delegate_to: "{{ gw_exporter_host }}"

# --- the gateway's own client keystore on the exporter host -------------------
# The app-client identity (O=app-org) is minted by the lab PKI; the gateway
# distributes it to its own exporter host so it can present a cert on the TLS 1.3
# app channel. Paths/secret are provided at apply time — the gateway reaches into
# the lab's PKI output, the lab is not asked to place anything.
- name: Create the app-client keystore directory
  ansible.builtin.file:
    path: "{{ gw_key_repo | dirname }}"
    state: directory
    owner: mqm
    group: mqm
    mode: "0700"
  become: true
  delegate_to: "{{ gw_exporter_host }}"

- name: Distribute the app-client keystore (the gateway's own client cert)
  ansible.builtin.copy:
    src: "{{ gw_app_client_p12 }}"
    dest: "{{ gw_key_repo }}.p12"
    owner: mqm
    group: mqm
    mode: "0600"
  become: true
  delegate_to: "{{ gw_exporter_host }}"

- name: Stash the keystore password for GSKit (.sth beside the .p12)
  ansible.builtin.command: >-
    {{ gw_mq_installation }}/bin/runmqakm -keydb -stashpw -type pkcs12
    -db {{ gw_key_repo }}.p12 -pw {{ gw_app_client_pw }}
  args:
    creates: "{{ gw_key_repo }}.sth"
  become: true
  become_user: mqm
  delegate_to: "{{ gw_exporter_host }}"
  no_log: true

# --- the gwlab reconcile exporter (on the exporter host) ----------------------
- name: Install the gwlab exporter systemd unit
  ansible.builtin.template:
    src: gwlab-exporter.service.j2
    dest: "/etc/systemd/system/gwlab-exporter-{{ counterparty | lower }}.service"
    mode: "0644"
  become: true
  delegate_to: "{{ gw_exporter_host }}"

- name: Enable and (re)start the gwlab exporter
  ansible.builtin.systemd:
    name: "gwlab-exporter-{{ counterparty | lower }}"
    enabled: true
    state: restarted
    daemon_reload: true
  become: true
  delegate_to: "{{ gw_exporter_host }}"

# --- the Prometheus scrape (gateway-owned target + gateway-added job) ----------
- name: Publish the gwlab exporter as a Prometheus file_sd target
  ansible.builtin.template:
    src: gwlab-targets.json.j2
    dest: "{{ gw_prometheus_targets_dir }}/gwlab.json"
    mode: "0644"
  become: true

- name: Add the gwlab scrape job to the running Prometheus (parasite; idempotent)
  ansible.builtin.blockinfile:
    path: /etc/prometheus/prometheus.yml
    marker: "# {mark} gwlab scrape job (added by the gateway parasite)"
    block: "  - job_name: gwlab\n    file_sd_configs:\n      - files: [\"{{ gw_prometheus_targets_dir }}/gwlab.json\"]\n"
  become: true
  notify: reload prometheus

# --- the per-QM boards (co-located with each QM's stack cockpit board) ---------
- name: Deploy the gateway boards into each queue manager's folder
  ansible.builtin.command:
    argv:
      - "{{ gw_python }}"
      - -m
      - gwlab.deploy_http
      - --counterparty
      - "{{ counterparty }}"
      - --prometheus-url
      - "{{ gw_prometheus_url }}"
      - --grafana-url
      - "{{ gw_grafana_url }}"
      - --grafana-user
      - "{{ gw_grafana_user }}"
      - --grafana-password
      - "{{ gw_grafana_password }}"
  environment:
    PYTHONPATH: "{{ gw_src_dir }}"
  register: gw_board_deploy
  changed_when: "'deployed' in gw_board_deploy.stdout"
