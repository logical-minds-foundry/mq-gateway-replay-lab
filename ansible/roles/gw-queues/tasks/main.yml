---
- name: Assert the target queue manager name was provided
  ansible.builtin.assert:
    that:
      - qmgr_name is defined
      - qmgr_name | length > 0
    fail_msg: >-
      qmgr_name must be set to the lab's running queue manager. gw-queues owns
      only its own GW.* queues; it never creates or mutates the queue manager.

- name: Verify the queue manager is running (declare-and-verify; never create it)
  ansible.builtin.command: /opt/mqm/bin/dspmq -m {{ qmgr_name }}
  become: true
  become_user: mqm
  register: dspmq
  changed_when: false
  failed_when: dspmq.rc != 0 or 'Running' not in dspmq.stdout

- name: Define the experiment's own round-trip queues (idempotent; GW.* only)
  ansible.builtin.shell: |
    set -o pipefail
    printf 'DEFINE QLOCAL(%s) DEFPSIST(YES) SHARE MAXDEPTH({{ gw_max_depth }})\n' {{ gw_queues | join(' ') }} \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: define_queues
  changed_when: "'AMQ8005' in define_queues.stdout"
  failed_when: define_queues.rc not in [0, 10]

- name: Stream each live queue to its audit queue via STRMQOS(MUSTDUP)
  ansible.builtin.shell: |
    set -o pipefail
    echo "ALTER QLOCAL({{ item.0 }}) STREAMQ({{ item.1 }}) STRMQOS(MUSTDUP)" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  loop: "{{ gw_streams }}"
  register: gw_stream
  changed_when: "'AMQ8008' in gw_stream.stdout"
  failed_when: gw_stream.rc not in [0, 10]

- name: Cap audit-queue retention to a rolling day via CAPEXPRY
  ansible.builtin.shell: |
    set -o pipefail
    echo "ALTER QLOCAL({{ item }}) CAPEXPRY({{ gw_audit_capexpry }})" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  loop: "{{ gw_audits }}"
  register: gw_capexpry
  changed_when: "'AMQ8008' in gw_capexpry.stdout"
  failed_when: gw_capexpry.rc not in [0, 10]
