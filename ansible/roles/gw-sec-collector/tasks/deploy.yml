---
# gw-sec-collector deploy — run the installed collector as a supervised client-mode
# systemd unit on the monitoring probe and publish its FIXED Prometheus scrape
# target (epic #65, streaming-collector design §8/§8.1). Same deployment shape as
# the base mq-exporter: a client on mon-probe, NOT a QM-node service. The scrape
# target is fixed (mon-probe:<port>) and series are labelled by `qmgr` (the stable
# identity that moves logically across a Native-HA failover), so the board is
# continuous and the QM nodes are never scraped.
#
# Parasite rule: touches only the gateway's own unit, its own monitoring keystore,
# and its own Prometheus target/job; it never mutates the base exporter, its
# keystores, or the QM. The live apply itself runs in the T2/T8 testing round — this
# task file only defines it (build.yml + install.yml must have landed the entry
# point at gw_collector_bin first).

- name: Assert the required apply-time values were provided
  ansible.builtin.assert:
    that:
      - gw_collector_qmgr | length > 0
      - gw_collector_conn | length > 0
      - gw_collector_mon_client_p12 | length > 0
      - gw_collector_mon_client_pw | length > 0
    fail_msg: >-
      Set gw_collector_qmgr, gw_collector_conn, and the mon-client keystore
      (gw_collector_mon_client_p12 + gw_collector_mon_client_pw) at apply time. No
      misleading defaults for the live topology or secrets — a mis-targeted apply
      must fail loudly.

# --- the gateway's own monitoring keystore on the probe (design §8) ------------
- name: Create the mon-client keystore directory
  ansible.builtin.file:
    path: "{{ gw_collector_key_repo | dirname }}"
    state: directory
    owner: "{{ gw_collector_user }}"
    group: "{{ gw_collector_group }}"
    mode: "0700"
  become: true
  delegate_to: "{{ gw_collector_host }}"

- name: Distribute the mon-client keystore (the collector's own monitoring cert)
  ansible.builtin.copy:
    src: "{{ gw_collector_mon_client_p12 }}"
    dest: "{{ gw_collector_key_repo }}.p12"
    owner: "{{ gw_collector_user }}"
    group: "{{ gw_collector_group }}"
    mode: "0600"
  become: true
  delegate_to: "{{ gw_collector_host }}"

- name: Stash the keystore password for GSKit (.sth beside the .p12)
  ansible.builtin.command: >-
    {{ gw_collector_mq_installation }}/bin/runmqakm -keydb -stashpw -type pkcs12
    -db {{ gw_collector_key_repo }}.p12 -pw {{ gw_collector_mon_client_pw }}
  args:
    creates: "{{ gw_collector_key_repo }}.sth"
  become: true
  become_user: "{{ gw_collector_user }}"
  delegate_to: "{{ gw_collector_host }}"
  no_log: true

# --- the supervised collector unit (design §8.1) ------------------------------
- name: Install the streaming collector systemd unit
  ansible.builtin.template:
    src: gwlab-collector.service.j2
    dest: /etc/systemd/system/gwlab-collector.service
    mode: "0644"
  become: true
  delegate_to: "{{ gw_collector_host }}"
  register: gw_collector_unit

- name: Enable and (re)start the streaming collector
  ansible.builtin.systemd:
    name: gwlab-collector
    enabled: true
    state: "{{ 'restarted' if gw_collector_unit is changed else 'started' }}"
    daemon_reload: true
  become: true
  delegate_to: "{{ gw_collector_host }}"

# --- the FIXED Prometheus scrape target (mon-probe:<port>, qmgr-labelled) ------
- name: Publish the collector as a fixed Prometheus file_sd target
  ansible.builtin.template:
    src: gwlab-collector-targets.json.j2
    dest: "{{ gw_prometheus_targets_dir }}/gwlab-collector.json"
    mode: "0644"
  become: true

- name: Add the collector scrape job to the running Prometheus (parasite; idempotent)
  ansible.builtin.blockinfile:
    path: /etc/prometheus/prometheus.yml
    marker: "# {mark} gwlab-collector scrape job (added by the gateway parasite)"
    block: "  - job_name: gwlab-collector\n    file_sd_configs:\n      - files: [\"{{ gw_prometheus_targets_dir }}/gwlab-collector.json\"]\n"
  become: true
  notify: reload prometheus
