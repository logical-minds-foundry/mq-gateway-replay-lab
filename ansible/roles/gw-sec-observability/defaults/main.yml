---
# v2 SWIFT settlement observability — parallel to gw-observability (v1), on a
# DISTINCT port so the two run side by side (spec §7). The exporter runs the swift
# serve module client-mode against the app queue manager and is scraped by
# Prometheus; a Grafana board (built by gwlab.swift.board, deployed by
# gwlab.swift.deploy_http) visualises the swift_settlement_* series. Enabled at
# install so a lab bring-up includes it — no manual gwlab commands after a rebuild.
# Parasite rule: adds only the gateway's own exporter/target/board; declares-and-
# verifies the lab's obs stack, never mutates it.

# --- required apply-time values (no misleading defaults; fail loudly) ----------
gw_sec_exporter_qmgr: ""       # REQUIRED — the running app queue manager
gw_sec_exporter_conn: ""       # REQUIRED — ConnectionName, e.g. "10.50.0.11(1414)"
gw_sec_exporter_channel: MON.SVRCONN   # Stage-2 SSLPEERMAP maps this to the read-only mqmon identity (epic #235)
gw_sec_exporter_port: 9110     # distinct from v1's 9109
gw_sec_horizon_days: 3

# The exporter host (MQ client + reachability to the QM listener).
gw_sec_exporter_host: mon-probe

# Reused runtime (same venv/source/keystore layout as gw-observability, so the two
# roles co-exist idempotently on the exporter host).
gw_venv: /opt/gwlab-venv
gw_python: "{{ gw_venv }}/bin/python"
gw_src_dir: /opt/gwlab-src
gw_src_local: "{{ playbook_dir }}/../src/gwlab"
gw_mq_installation: /opt/mqm

# Mutual TLS to the MON SVRCONN (the estate mandates TLS 1.3). The exporter now
# connects as the mqmon observer identity (via MON.SVRCONN) using the mq_prometheus
# (O=app-org, OU=ops) keystore — which Stage-2 SSLPEERMAP maps to the read-only
# mqmon account — NOT the mqapp business identity (epic #235).
gw_tls_cipher: ANY_TLS13_OR_HIGHER
gw_key_repo: /var/mqm/ssl/mq_prometheus/key
gw_cert_label: mq_prometheus
gw_sec_exporter_mon_p12: ""    # REQUIRED — path to the mq_prometheus (OU=ops) keystore on the controller
gw_sec_exporter_mon_pw: ""     # REQUIRED — the monitoring keystore password

# The lab's obs node (Prometheus + Grafana).
gw_prometheus_targets_dir: /etc/prometheus/targets
gw_prometheus_url: http://localhost:9090
gw_grafana_url: http://localhost:3000
gw_grafana_user: admin
gw_grafana_password: admin

# --- declare-and-verify: the lab's IBM MQ exporter watches our audit queues ----
# The board's Register C reads the standard IBM MQ Prometheus exporter's
# filesystem-in-use (ibmmq_qmgr_*_file_system_bytes_in_use) and per-queue series
# for the GW.SEC.* audit queues. That exporter is the LAB's, not the gateway's, so
# this is the endorsed boundary crossing: we verify it is present and add ONLY a
# gateway-marked block extending its monitored-queue set to GW.SEC.* — never a
# rewrite of the lab's config. A missing exporter fails loudly (parasite boundary
# rule), it is not silently created. Point these at the running exporter at apply
# time (mq-metric-samples' YAML config with an objects.queues list is assumed).
gw_sec_audit_queue_pattern: "GW.SEC.*"
gw_sec_mq_exporter_host: "{{ gw_sec_exporter_host }}"
gw_sec_mq_exporter_config: /etc/mqmetric/mq.yaml
gw_sec_mq_exporter_service: mq-metric-samples
