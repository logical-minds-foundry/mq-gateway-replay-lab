---
# Parasite: the gateway makes every change it needs to the RUNNING lab from its
# own tooling, idempotently. A lab rebuild wipes these; re-running re-establishes
# them. Enabled units mean a bring-up includes the exporter without manual steps.
- name: Assert the required apply-time values were provided
  ansible.builtin.assert:
    that:
      - gw_sec_exporter_qmgr | length > 0
      - gw_sec_exporter_conn | length > 0
      - gw_app_client_p12 | length > 0
      - gw_app_client_pw | length > 0
    fail_msg: >-
      Set gw_sec_exporter_qmgr, gw_sec_exporter_conn, and the app-client keystore
      (gw_app_client_p12 + gw_app_client_pw) at apply time. No misleading defaults
      for the live topology or secrets — a mis-targeted apply must fail loudly.

# --- provision the exporter runtime on the exporter host ----------------------
- name: Create the gwlab virtualenv with pymqi (compiled against the MQ client)
  ansible.builtin.pip:
    name: pymqi
    virtualenv: "{{ gw_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
  environment:
    MQ_INSTALLATION_PATH: "{{ gw_mq_installation }}"
  become: true
  delegate_to: "{{ gw_sec_exporter_host }}"

- name: Place the gwlab source on the exporter host
  ansible.builtin.copy:
    src: "{{ gw_src_local }}"
    dest: "{{ gw_src_dir }}/"
    mode: "0644"
    directory_mode: "0755"
  become: true
  delegate_to: "{{ gw_sec_exporter_host }}"

# --- the gateway's own client keystore on the exporter host -------------------
- name: Create the app-client keystore directory
  ansible.builtin.file:
    path: "{{ gw_key_repo | dirname }}"
    state: directory
    owner: mqm
    group: mqm
    mode: "0700"
  become: true
  delegate_to: "{{ gw_sec_exporter_host }}"

- name: Distribute the app-client keystore (the gateway's own client cert)
  ansible.builtin.copy:
    src: "{{ gw_app_client_p12 }}"
    dest: "{{ gw_key_repo }}.p12"
    owner: mqm
    group: mqm
    mode: "0600"
  become: true
  delegate_to: "{{ gw_sec_exporter_host }}"

- name: Stash the keystore password for GSKit (.sth beside the .p12)
  ansible.builtin.command: >-
    {{ gw_mq_installation }}/bin/runmqakm -keydb -stashpw -type pkcs12
    -db {{ gw_key_repo }}.p12 -pw {{ gw_app_client_pw }}
  args:
    creates: "{{ gw_key_repo }}.sth"
  become: true
  become_user: mqm
  delegate_to: "{{ gw_sec_exporter_host }}"
  no_log: true

# --- the swift settlement exporter (on the exporter host) ---------------------
- name: Install the swift settlement exporter systemd unit
  ansible.builtin.template:
    src: gwlab-swift-exporter.service.j2
    dest: /etc/systemd/system/gwlab-swift-exporter.service
    mode: "0644"
  become: true
  delegate_to: "{{ gw_sec_exporter_host }}"

- name: Enable and (re)start the swift settlement exporter
  ansible.builtin.systemd:
    name: gwlab-swift-exporter
    enabled: true
    state: restarted
    daemon_reload: true
  become: true
  delegate_to: "{{ gw_sec_exporter_host }}"

# --- the Prometheus scrape (gateway-owned target + gateway-added job) ----------
- name: Publish the swift exporter as a Prometheus file_sd target
  ansible.builtin.template:
    src: gwlab-swift-targets.json.j2
    dest: "{{ gw_prometheus_targets_dir }}/gwlab-swift.json"
    mode: "0644"
  become: true

- name: Add the swift scrape job to the running Prometheus (parasite; idempotent)
  ansible.builtin.blockinfile:
    path: /etc/prometheus/prometheus.yml
    marker: "# {mark} gwlab-swift scrape job (added by the gateway parasite)"
    block: "  - job_name: gwlab-swift\n    file_sd_configs:\n      - files: [\"{{ gw_prometheus_targets_dir }}/gwlab-swift.json\"]\n"
  become: true
  notify: reload prometheus

# --- the Grafana board --------------------------------------------------------
- name: Deploy the swift settlement board into Grafana
  ansible.builtin.command:
    argv:
      - "{{ gw_python }}"
      - -m
      - gwlab.swift.deploy_http
      - --qmgr
      - "{{ gw_sec_exporter_qmgr }}"
      - --prometheus-url
      - "{{ gw_prometheus_url }}"
      - --grafana-url
      - "{{ gw_grafana_url }}"
      - --grafana-user
      - "{{ gw_grafana_user }}"
      - --grafana-password
      - "{{ gw_grafana_password }}"
  environment:
    PYTHONPATH: "{{ gw_src_dir }}"
  register: gw_sec_board_deploy
  changed_when: "'deployed' in gw_sec_board_deploy.stdout"
