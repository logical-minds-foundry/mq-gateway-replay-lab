---
# Their side of the SWIFT securities-settlement (v2) remote model (epic #65):
# applied to SVCQM, the counterparty's own queue manager. The their-side half of
# the GW.SEC.* round-trip, mirroring gw-svc-queues (the v1 their-side role)
# exactly — same assert/verify/runmqsc pattern — but this role's "own" objects
# live on the counterparty's box, not ours: it creates ONLY the landing queue our
# streamed instructions arrive on and the reply route back to us, and
# declare-and-verifies the existing return XMITQ/channel (parasite / boundary
# rule; never touches anything else on SVCQM). Names match gw-sec-queues.

# svc_qmgr names this queue manager as it appears in the inter-QM link (the
# first half of the return channel name below). Defaulted because it is a
# naming constant of the topology, not a live-apply target.
svc_qmgr: SVCQM

# our_qmgr is intentionally left unset — it must be provided at apply time
# (like qmgr_name below): the name of OUR queue manager, used as RQMNAME/XMITQ
# for the reply QREMOTE and as the second half of the return channel name. A
# missing value fails loudly (see tasks), so a mis-targeted apply never
# silently wires the reply route to the wrong box.
our_qmgr: ""

# Named queues (match gw-sec-queues, as seen from SVCQM):
# - q_instruct is OUR landing queue on SVCQM — the responder's own consumer
#   reads it locally; this role only provisions the QLOCAL it lands on. It is
#   the RNAME target of our-side GW.SEC.INSTRUCT.REMOTE QREMOTE.
# - q_reply is the QREMOTE that routes SVCQM's replies back to our GW.SEC.REPLY.
q_instruct: "GW.SEC.INSTRUCT"
q_reply: "GW.SEC.REPLY"

# Sizing for production-scale volume — same rationale as gw-sec-queues: the
# default MAXDEPTH(5000) is far too small for a settlement horizon of traffic,
# and the single queue-file limit is not a concern (MAXFSIZE(DEFAULT) ~2 TB).
gw_sec_max_depth: 999999999

# qmgr_name is intentionally left unset — it must be provided at apply time
# (SVCQM's live instance name at the counterparty). A missing value fails
# loudly (see tasks), so a mis-targeted apply never silently hits the wrong box.
