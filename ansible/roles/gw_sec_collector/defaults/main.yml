---
# gw_sec_collector — install the streaming settlement collector as a REAL
# installed artifact on the monitoring probe (epic #65, streaming-collector
# design §9). The production end-state is "installed built artifact + stable
# entry point", NOT "source tree + PYTHONPATH": build a wheel from this repo,
# then install it into an isolated /opt/gwlab virtualenv on mon-probe so the
# collector runs as /opt/gwlab/bin/gwlab-collector — the exact line a packaged
# install would expose. The box-only serve loop, CCDT/monitoring identity, and
# systemd unit arrive in later tasks of the plan; this role is the T1 packaging
# skeleton (build + install the entry point).
#
# Parasite rule: this installs ONLY the gateway's own artifact under /opt/gwlab
# on the probe; it never mutates the base lab's exporter, keystores, or QM.

# The monitoring probe — a stable off-cluster node that already carries the MQ
# client libraries for the base mq_prometheus exporter (mirrors mq-exporter's
# "on mon-probe" host targeting). The collector is installed and (later) run here.
gw_collector_host: mon-probe

# Isolated install prefix. The virtualenv is rooted here, so its own bin/ exposes
# the console_scripts entry point directly at /opt/gwlab/bin/gwlab-collector — no
# source tree, no PYTHONPATH, no symlink needed (the venv layout IS the entry
# point). Kept distinct from the source-tree venv the v1/v2 exporters still use
# (/opt/gwlab-venv, /opt/gwlab-src) so the two models co-exist on the probe.
gw_collector_prefix: /opt/gwlab
gw_collector_bin: "{{ gw_collector_prefix }}/bin/gwlab-collector"

# Controller-side build. uv builds the wheel from the repo root into dist/; the
# artifact is representative of a package-index install, reached by a local build.
gw_collector_project_root: "{{ playbook_dir }}/.."
gw_collector_dist_dir: "{{ gw_collector_project_root }}/dist"

# Host-side staging dir for the copied wheel (the artifact handed to the probe's
# pip install; separate from the venv so a re-build/re-install is a clean replace).
gw_collector_stage_dir: /opt/gwlab-dist

# The interpreter the isolated venv is built from (mon-probe's system Python).
gw_collector_base_python: /usr/bin/python3

# --- deploy-time: run the installed collector as a supervised client (T7) -------
# The deploy half (tasks/deploy.yml, design §8/§8.1): render + enable the systemd
# unit that runs gw_collector_bin client-mode on the probe, and publish a FIXED
# Prometheus scrape target. The build/install skeleton above lands the entry point;
# these values drive how it runs. The live apply happens in the T2/T8 round.

# REQUIRED apply-time values — no misleading defaults for the live topology or
# secrets (a mis-targeted apply must fail loudly, not connect somewhere wrong).
gw_collector_qmgr: ""            # REQUIRED — the app queue manager's name (the stable
                                 # `qmgr` identity that moves across a Native-HA failover)
gw_collector_conn: ""            # REQUIRED — ConnectionName: a comma-separated CONNAME
                                 # list of every node (Native HA has no VIP — the client
                                 # reaches whichever holds the QM), e.g.
                                 # "10.50.0.11(1414),10.50.0.12(1414),10.50.0.13(1414)"

# The dedicated monitoring channel + port. 9111 is distinct from the v1 (9109) and
# v2 (9110) exporters so all three run side by side on the shared probe.
gw_collector_channel: MON.SVRCONN
gw_collector_port: 9111
gw_collector_horizon_days: 3
gw_collector_poll_seconds: 5     # loop-level sleep between full sweeps (the
                                 # collector's own cadence, decoupled from the scrape)

# systemd supervision (design §8.1): Restart=always for crash -> restart ->
# cold-reload, and StartLimit* so a crash-loop drives the unit into `failed`
# (alertable) rather than an invisible restart storm.
gw_collector_restart_sec: 5
gw_collector_start_limit_interval_sec: 60
gw_collector_start_limit_burst: 5

# The dedicated monitoring identity (design §8) — a monitoring SVRCONN + keystore
# in the style of the base exporter's MON.SVRCONN / mq_prometheus cert, NOT the app
# or responder identities. The unit runs as this user on the probe.
gw_collector_user: mqm
gw_collector_group: mqm
gw_collector_mq_installation: /opt/mqm

# Mutual TLS to the monitoring SVRCONN (the estate mandates TLS 1.3). Set the
# cipher to "" to render a plaintext unit for an offline bring-up.
gw_collector_tls_cipher: ANY_TLS13_OR_HIGHER
gw_collector_key_repo: /var/mqm/ssl/mon-client/key
gw_collector_cert_label: mon-client
gw_collector_mon_client_p12: ""  # REQUIRED — path to mon-client.p12 on the controller
gw_collector_mon_client_pw: ""   # REQUIRED — the monitoring keystore password

# The lab's Prometheus file_sd targets dir. The scrape target is FIXED —
# gw_collector_host:gw_collector_port — so the moving-target problem of a QM-node
# service never arises; series are labelled by `qmgr`, never by node.
gw_prometheus_targets_dir: /etc/prometheus/targets
