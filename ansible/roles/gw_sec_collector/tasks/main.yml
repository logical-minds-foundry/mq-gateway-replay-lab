---
# gw_sec_collector — build the gwlab wheel (once, on the controller) and install
# it as a real artifact into an isolated /opt/gwlab on the monitoring probe,
# exposing /opt/gwlab/bin/gwlab-collector (epic #65, design §9; mirrors the
# mq-exporter role's build/instance split and its "on mon-probe" host targeting).
# This is the T1 packaging skeleton: the box-only serve loop, the monitoring CCDT
# identity, and the systemd unit are added by later tasks of the plan.
- name: Build the gwlab wheel (once, on the controller)
  ansible.builtin.include_tasks: build.yml

- name: Install the collector artifact + entry point on the probe
  ansible.builtin.include_tasks: install.yml
