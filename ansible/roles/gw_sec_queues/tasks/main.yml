---
- name: Assert the target queue manager name was provided
  ansible.builtin.assert:
    that:
      - qmgr_name is defined
      - qmgr_name | length > 0
    fail_msg: >-
      qmgr_name must be set to the lab's running queue manager. gw_sec_queues
      owns only its own GW.SEC.* queues; it never creates or mutates the queue
      manager.

- name: Verify the queue manager is running (declare-and-verify; never create it)
  ansible.builtin.command: /opt/mqm/bin/dspmq -m {{ qmgr_name }}
  become: true
  become_user: mqm
  register: dspmq
  changed_when: false
  failed_when: dspmq.rc != 0 or 'Running' not in dspmq.stdout

# --- our own GW.SEC.* objects (the remote model, issue #56) --------------------
# REPLACE makes every DEFINE below converge to the desired attributes on each
# apply rather than error on "already exists" — idempotency here means
# "same state after every run", not "no-op after the first run".

- name: Define the audit QLOCALs (retained-original instructions + response ledger; multi-day CAPEXPRY)
  ansible.builtin.shell: |
    set -o pipefail
    printf "DEFINE QLOCAL(%s) DEFPSIST(YES) SHARE MAXDEPTH({{ gw_sec_max_depth }}) CAPEXPRY({{ gw_sec_capexpry }}) REPLACE\n" \
      {{ gw_sec_audit_queues | join(' ') }} \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: define_audits
  changed_when: "'AMQ8006' in define_audits.stdout"
  failed_when: define_audits.rc != 0

- name: Define the inbound reply QLOCAL (responses land here, then stream to the status audit)
  ansible.builtin.shell: |
    set -o pipefail
    echo "DEFINE QLOCAL('{{ q_reply }}') DEFPSIST(YES) SHARE MAXDEPTH({{ gw_sec_max_depth }}) REPLACE" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: define_reply
  changed_when: "'AMQ8006' in define_reply.stdout"
  failed_when: define_reply.rc != 0

- name: Define the QALIAS (the app's transparent put target for instructions)
  ansible.builtin.shell: |
    set -o pipefail
    echo "DEFINE QALIAS('{{ q_instruct }}') TARGET('{{ q_instruct_audit }}') REPLACE" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: define_alias
  changed_when: "'AMQ8006' in define_alias.stdout"
  failed_when: define_alias.rc != 0

- name: Define the QREMOTE (stream target -> counterparty landing, over the existing XMITQ)
  ansible.builtin.shell: |
    set -o pipefail
    echo "DEFINE QREMOTE('{{ q_instruct_remote }}') RNAME('{{ q_instruct }}') RQMNAME('{{ svc_qmgr }}') XMITQ('{{ svc_qmgr }}') REPLACE" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: define_remote
  changed_when: "'AMQ8006' in define_remote.stdout"
  failed_when: define_remote.rc != 0

- name: Stream each live queue to its MUSTDUP target (retained original -> remote landing; reply -> status audit)
  ansible.builtin.shell: |
    set -o pipefail
    echo "ALTER QLOCAL({{ item.0 }}) STREAMQ({{ item.1 }}) STRMQOS(MUSTDUP)" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  loop: "{{ gw_sec_streams }}"
  register: gw_sec_stream
  changed_when: "'AMQ8008' in gw_sec_stream.stdout"
  failed_when: gw_sec_stream.rc not in [0, 10]

# --- the existing inter-QM link (the lab's) — declare-and-verify, never create -
- name: Declare-and-verify the existing XMITQ to the counterparty (parasite boundary; fail loudly if absent)
  ansible.builtin.shell: |
    set -o pipefail
    echo "DISPLAY QLOCAL('{{ svc_qmgr }}') USAGE" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: verify_xmitq
  changed_when: false
  failed_when: verify_xmitq.rc != 0 or 'USAGE(XMITQ)' not in verify_xmitq.stdout

- name: Declare-and-verify the existing channel to the counterparty (parasite boundary; fail loudly if absent)
  ansible.builtin.shell: |
    set -o pipefail
    echo "DISPLAY CHANNEL('{{ qmgr_name }}.{{ svc_qmgr }}')" \
      | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: verify_channel
  changed_when: false
  failed_when: verify_channel.rc != 0 or 'CHANNEL(' not in verify_channel.stdout

# --- least-privilege authority model (epic #235) ------------------------------
# Stage 2 (base-lab accounts + CHLAUTH SSLPEERMAP) is a §6.0 prerequisite the
# deployment task establishes on this box; here we declare-and-verify it is
# present, then layer our setmqaut -g grants on the GW.SEC.* objects we own.
- name: Declare-and-verify the base lab's Stage-2 observer/app/MCA groups exist
  ansible.builtin.command: "id {{ item }}"
  become: true
  loop:
    - "{{ gw_sec_observer_group }}"
    - "{{ gw_sec_app_group }}"
    - "{{ gw_sec_mca_group }}"
  register: gw_sec_group_check
  changed_when: false
  failed_when: gw_sec_group_check.rc != 0
  # A missing account means Stage 2 was never applied to this box (the deployment
  # task's §6.0 prerequisite). Fail loudly rather than grant to a non-existent group.

- name: Declare-and-verify CHLAUTH is enabled (channels no longer run as mqm)
  ansible.builtin.shell: |
    set -o pipefail
    echo "DISPLAY QMGR CHLAUTH" | /opt/mqm/bin/runmqsc {{ qmgr_name }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  register: gw_sec_chlauth
  changed_when: false
  failed_when: "gw_sec_chlauth.rc != 0 or 'CHLAUTH(ENABLED)' not in gw_sec_chlauth.stdout"

- name: Apply the least-privilege authority grants (setmqaut -g on our GW.SEC.* objects)
  ansible.builtin.shell: |
    set -o pipefail
    /opt/mqm/bin/setmqaut -m {{ qmgr_name }} -n {{ item.object }} -t queue -g {{ item.group }} {{ item.authorities }}
  args:
    executable: /bin/bash
  become: true
  become_user: mqm
  loop: "{{ gw_sec_grants }}"
  register: gw_sec_setmqaut
  changed_when: "'completed successfully' in gw_sec_setmqaut.stdout"
  failed_when: gw_sec_setmqaut.rc != 0
  # setmqaut takes each authority as its own +xxx token; item.authorities expands
  # to the space-separated list. Re-running with the same grants is idempotent.

- name: Verify mqmon holds browse but NOT get/put on an audit ledger
  ansible.builtin.command: "/opt/mqm/bin/dspmqaut -m {{ qmgr_name }} -n {{ q_instruct_audit }} -t queue -g {{ gw_sec_observer_group }}"
  become: true
  become_user: mqm
  register: gw_sec_mon_aut
  changed_when: false
  failed_when: >-
    gw_sec_mon_aut.rc != 0 or
    'browse' not in gw_sec_mon_aut.stdout or
    'get' in gw_sec_mon_aut.stdout or
    'put' in gw_sec_mon_aut.stdout

- name: Verify mqapp is read-only on the outbound audit ledger (may browse; NOT get)
  ansible.builtin.command: "/opt/mqm/bin/dspmqaut -m {{ qmgr_name }} -n {{ q_instruct_audit }} -t queue -g {{ gw_sec_app_group }}"
  become: true
  become_user: mqm
  register: gw_sec_app_aut
  changed_when: false
  # The audit ledger is the app's own history: mqapp may read it (browse+inq) and
  # holds +put for the retained original — but it must NOT hold +get (that would
  # consume the retained original), the load-bearing non-destructive invariant.
  failed_when: >-
    gw_sec_app_aut.rc != 0 or
    'browse' not in gw_sec_app_aut.stdout or
    'get' in gw_sec_app_aut.stdout
