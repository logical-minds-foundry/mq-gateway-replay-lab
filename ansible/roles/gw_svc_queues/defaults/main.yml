---
# Their side of the remote object model (issue #56): applied to SVCQM, the
# counterparty's own queue manager. Mirrors gw_queues' conventions exactly —
# same assert/verify/runmqsc pattern — but this role's "own" objects live on
# the counterparty's box, not ours: it creates ONLY the landing queue and the
# reply route back to us, and declare-and-verifies the existing return
# XMITQ/channel (parasite / boundary rule; never touches anything else on
# SVCQM).

# The counterparty tag selecting the queue set (matches gwlab's QueueSet).
counterparty: CPB

# svc_qmgr names this queue manager as it appears in the inter-QM link (the
# first half of the return channel name below). Defaulted because it is a
# naming constant of the topology, not a live-apply target.
svc_qmgr: SVCQM

# our_qmgr is intentionally left unset — it must be provided at apply time
# (like qmgr_name below): the name of OUR queue manager, used as RQMNAME/XMITQ
# for the reply QREMOTE and as the second half of the return channel name. A
# missing value fails loudly (see tasks), so a mis-targeted apply never
# silently wires the reply route to the wrong box.
our_qmgr: ""

# Named queues (match gwlab's QueueSet, as seen from SVCQM):
# - q_request is OUR landing queue on SVCQM — the responder's own consumer
#   reads it locally; this role only provisions the QLOCAL it lands on.
# - q_reply is the QREMOTE that routes SVCQM's replies back to our GW.CPB.REPLY.
q_request: "GW.{{ counterparty }}.REQUEST"
q_reply: "GW.{{ counterparty }}.REPLY"

# Sizing for production-scale volume — same rationale as gw_queues: the
# default MAXDEPTH(5000) is far too small for a day of traffic at scale, and
# the single queue-file limit is not a concern (MAXFSIZE(DEFAULT) ~2 TB).
gw_max_depth: 999999999

# qmgr_name is intentionally left unset — it must be provided at apply time
# (SVCQM's live instance name at the counterparty). A missing value fails
# loudly (see tasks), so a mis-targeted apply never silently hits the wrong box.
