[project]
name = "gwlab"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
gwlab = "gwlab.cli:main"

[dependency-groups]
dev = ["ruff", "mypy", "ty", "pytest", "pytest-cov", "pip-audit", "pip-licenses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwlab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH", "ARG", "PTH", "ERA"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is idiomatic in pytest
"tests/**" = ["S101", "S106", "S603", "S607", "ARG", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# The pymqi adapter needs the MQ client libraries, so it cannot run in the
# validation container. It is verified end-to-end on the live queue manager
# (the two-process last-hour run — demo/gateway_driver.py + demo/svc_responder.py
# — plus the remote proof harnesses under demo/proofs/), not by unit tests. The exporter
# HTTP server binds a socket and connects via pymqi, so it is likewise box-only;
# the exposition it serves (exporter.render) is unit-tested. The SVC responder's
# live loop (serve_responder) is likewise box-only — it drives pymqi UOWs and sleeps
# against real time; its planning/scheduling cores (responder_app, scheduler) are.
omit = [
    "src/gwlab/pymqi_messaging.py",
    "src/gwlab/exporter_server.py",
    "src/gwlab/deploy_http.py",
    "src/gwlab/swift/serve_http.py",
    "src/gwlab/swift/serve_responder.py",
    "src/gwlab/swift/deploy_http.py",
    "src/gwlab/swift/gateway_run.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    ": \\.\\.\\.$",
]
