[project]
name = "gwlab"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
gwlab = "gwlab.cli:main"
gwlab-collector = "gwlab.swift.stream.serve_collector:main"

[dependency-groups]
dev = ["ruff", "mypy", "ty", "pytest", "pytest-cov", "pip-audit", "pip-licenses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwlab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH", "ARG", "PTH", "ERA"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is idiomatic in pytest
"tests/**" = ["S101", "S106", "S603", "S607", "ARG", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# The pymqi adapter needs the MQ client libraries, so it cannot run in the
# validation container. It is verified end-to-end on the live queue manager
# (the two-process last-hour run — demo/gateway_driver.py + demo/svc_responder.py
# — plus the remote proof harnesses under demo/proofs/), not by unit tests. The exporter
# HTTP server binds a socket and connects via pymqi, so it is likewise box-only;
# the exposition it serves (exporter.render) is unit-tested. The v1 deploy_http
# client talks to Prometheus/Grafana over HTTP.
#
# The epic-#65 box-only modules (swift/{serve_http,serve_responder,gateway_run,
# deploy_http}.py and swift/stream/serve_collector.py) are NO LONGER exempt: issue
# #129 retired them from this list by testing their loop/handler logic against the
# mocked pymqi/socket/clock boundary (a fake Messaging, a patched HTTPServer /
# threading.Thread / time.sleep, and a mocked urlopen), reaching 100% coverage
# without a live box.
omit = [
    "src/gwlab/pymqi_messaging.py",
    "src/gwlab/exporter_server.py",
    "src/gwlab/deploy_http.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    ": \\.\\.\\.$",
]
