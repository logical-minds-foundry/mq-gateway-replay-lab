[project]
name = "gwlab"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
gwlab = "gwlab.cli:main"
gwlab-collector = "gwlab.swift.stream.serve_collector:main"

[dependency-groups]
dev = ["ruff", "mypy", "ty", "pytest", "pytest-cov", "pip-audit", "pip-licenses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwlab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH", "ARG", "PTH", "ERA"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is idiomatic in pytest
"tests/**" = ["S101", "S106", "S603", "S607", "ARG", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# This repo has ZERO whole-module coverage exemptions: every module in src/ is
# covered to 100% branch + line. The box-only modules that once lived here — the
# pymqi adapter (pymqi_messaging.py), the v1 exporter HTTP server
# (exporter_server.py), and the v1 Grafana/Prometheus deploy client
# (deploy_http.py) — were retired from this omit list in issue #157 by testing
# their logic against the mocked boundary: an injected fake `pymqi` module
# (no MQ client libs needed), a stubbed request handler + patched HTTPServer so
# nothing binds, and a mocked urllib.request.urlopen. The epic-#65 box-only
# modules were retired the same way in #129. The live end-to-end proofs on the
# box (demo/gateway_driver.py + demo/svc_responder.py, the remote harnesses under
# demo/proofs/) are retained on top of the unit coverage, not replaced by it.
omit = []

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    ": \\.\\.\\.$",
]
